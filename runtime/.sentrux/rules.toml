# Runtime-scoped architectural guardrails.
# Current baseline at creation: quality_signal=5195.

[constraints]
min_quality = 0.50
min_modularity = 0.30
min_acyclicity = 1.0
min_equality = 0.45
# Re-placed 2026-07-12: operating point 0.2513, noise band 0.0014 ->
# 3 bands below (was knife-edge; dipped under 0.25 twice inside the
# 30-commit kickoff window without anyone noticing).
min_redundancy = 0.245
max_cc = 70
max_fn_lines = 300

[[layers]]
name = "native"
paths = ["native/**"]
order = 0
