name: CI

# Быстрая полоса: компиляция, статика, корректность. Живёт на бесплатных
# hosted-раннерах и потому безопасна для PR из форков. Тяжёлое и тайминговое
# уехало на выделенную машину (`ci-selfhosted.yml`), потому что там нужен
# совпадающий с эталоном LLVM и тишина.
#
# Ветки рабочих полос добавлены сюда 2026-08-27: до этого триггеры стояли
# только на `dev` и `main`, поэтому на `codex/**` CI не бежал с июня.
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main, 'codex/**', 'wip/**']
  workflow_call:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Тесты компилируют программы во временных каталогах, а stdlib ищется по
# SURGE_STDLIB. На рабочей машине переменная стоит в профиле, на раннере её
# нет -- и ряды падали не по существу, а с `SEM3005 cannot resolve 'clone'`.
env:
  SURGE_STDLIB: ${{ github.workspace }}

jobs:
  test-go:
    name: Go tests (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SURGE_SKIP_TIMEOUT_TESTS: "1"
    strategy:
      fail-fast: false
      matrix:
        backend: [vm, llvm]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Valgrind
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind
      - name: Install LLVM toolchain
        if: matrix.backend == 'llvm'
        run: sudo apt-get install -y clang llvm lld
      - name: Run go tests (vm)
        if: matrix.backend == 'vm'
        env:
          SURGE_BACKEND: vm
        run: go test ./...
      - name: Run go tests (llvm)
        if: matrix.backend == 'llvm'
        env:
          SURGE_MT_TIMEOUT_SCALE: "3"
        run: go test ./...

  runtime-v2-check:
    name: Runtime V2 liveness (llvm)
    runs-on: ubuntu-latest
    # The aggregate runs its whole roster of sub-gates now instead of stopping at
    # the first red one, so the job does the work of the entire roster rather than
    # of however many happened to precede the first failure. A job killed by this
    # limit reports as a timeout and the sub-gates it never reached go unanswered,
    # which is the state this budget exists to avoid.
    #
    # Measured at 03379549 on this runner: the roster's own per-row clocks summed
    # to 1251s against a 21m18s job. The headroom is what pays for rows that move
    # onto the roster from the closeout sanitizer sweep. runtime-v2-heap-check is
    # a mandatory roster member and owns Valgrind rows, so this job provisions
    # Valgrind; the larger closeout sweep remains on ci-selfhosted.yml.
    timeout-minutes: 45
    env:
      SURGE_MT_TIMEOUT_SCALE: "3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install LLVM and Valgrind toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm lld binutils valgrind
      - name: Run Runtime V2 liveness gate
        run: make runtime-v2-check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.3
          args: --config .golangci.yaml

  c-check-gcc:
    name: C runtime checks (gcc)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: Check C code formatting
        run: make cfmt-check
      - name: Compile C runtime with strict warnings (gcc)
        run: CC=gcc make c-warnings

  c-check-clang:
    name: C runtime checks (clang)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld clang-tidy cppcheck
      - name: Check C code formatting
        run: make cfmt-check
      - name: Compile C runtime with strict warnings (clang)
        run: make c-warnings
      - name: Run clang-tidy
        run: make ctidy
      - name: Run cppcheck
        run: make cppcheck

  c-scan-build:
    name: C runtime scan-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld clang-tools
      - name: Run scan-build
        run: |
          cd runtime/native
          scan-build --status-bugs --use-cc=clang --use-c++=clang++ \
            sh -c 'for f in *.c; do clang -std=c11 -I. -c "$f" -o "/tmp/${f%.c}.o" 2>&1 || true; done'

  c-sanitizers:
    name: C runtime sanitizers (ASan+UBSan)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld
      - name: Run Runtime V2 owned-storage gate (ASan+UBSan+TSan)
        run: make runtime-v2-owned-storage-check

  loc-cap:
    name: LOC cap
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check effective LOC cap
        run: ./check_file_sizes.sh -a

  testdata:
    name: Testdata (vm)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Golden regression
        run: |
          set -o pipefail
          mkdir -p build/testdata/vm
          make golden-check 2>&1 | tee build/testdata/vm/golden-check.log
      - name: Corpus determinism
        run: make golden-corpus-determinism
      - name: Behavioural corpus (vm)
        run: make behaviour-check
      - name: Upload testdata artifacts (vm)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testdata-vm-artifacts
          path: |
            build/testdata/vm

  testdata-llvm:
    name: Testdata (llvm)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install LLVM toolchain
        run: sudo apt-get update && sudo apt-get install -y clang llvm lld
      - name: Behavioural corpus (vm + native)
        run: make behaviour-check-all

  build-linux-amd64:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [test-go, lint, c-check-gcc, c-check-clang, loc-cap, testdata, testdata-llvm]
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build surge (linux/amd64)
        run: |
          set -euo pipefail
          LDFLAGS=$(./scripts/ldflags.sh)
          mkdir -p build
          GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o build/surge ./cmd/surge
      - name: Upload surge artifact
        uses: actions/upload-artifact@v4
        with:
          name: surge-linux-amd64
          path: build/surge
